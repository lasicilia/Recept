<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voir salle</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@100;400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <nav>
    <h2>Voir salle</h2>
  </nav>

  <section class="section-salle">
    <div class="salle-main">
      <div class="salle">
        <h1 class="text">Les SALLES</h1>
      </div>
      <div class="section-description">
        Quelles types de salles voulez-vous ?
      </div>
    </div>

    <div class="products-container">
      
      <!-- Salle de réunion -->
      <div class="product-items">
        <div class="product-image">
          <img src="./Images/meeting-4565703.jpg" alt="Salle de réunion">
        </div>
        <div class="product-details">
          <div class="product-category">Salle de réunion</div>
          <div class="product-vip">VIP</div>
        </div>
      </div>

      <!-- Salle de séminaire -->
      <div class="product-items">
        <div class="product-image">
          <img src="./Images/room-2192484.jpg" alt="Salle de séminaire">
        </div>
        <div class="product-details">
          <div class="product-category">Salle de séminaire</div>
          <div class="product-normal">Normal</div>
        </div>
      </div>

      <!-- Salle de mariage -->
      <div class="product-items">
        <div class="product-image">
          <img src="./Images/wedding-1610690.jpg" alt="Salle de mariage">
        </div>
        <div class="product-details">
          <div class="product-category">Salle de mariage</div>
          <div class="product-normal">Normal</div>
        </div>
      </div>

      <!-- Salle de fête -->
      <div class="product-items">
        <div class="product-image">
          <img src="./Images/table-4736377.jpg" alt="Salle de fête">
        </div>
        <div class="product-details">
          <div class="product-category">Salle de fête</div>
          <div class="product-normal">Normal</div>
        </div>
      </div>

      <!-- Salle de banquet -->
      <div class="product-items">
        <div class="product-image">
          <img src="./Images/banquet-2945619.jpg" alt="Salle de banquet">
        </div>
        <div class="product-details">
          <div class="product-category">Salle de banquet</div>
          <div class="product-vip">VIP</div>
        </div>
      </div>

      <!-- Salle de conférence -->
      <div class="product-items">
        <div class="product-image">
          <img src="./Images/graduation-710041.jpg" alt="Salle de conférence">
        </div>
        <div class="product-details">
          <div class="product-category">Salle de conférence</div>
          <div class="product-normal">Normal</div>
        </div>
      </div>

      <!-- Salle de réception -->
      <div class="product-items">
        <div class="product-image">
          <img src="./Images/table-setting-791148.jpg" alt="Salle de réception">
        </div>
        <div class="product-details">
          <div class="product-category">Salle de réception</div>
          <div class="product-normal">Normal</div>
        </div>
      </div>

      <!-- Salle d'anniversaire -->
      <div class="product-items">
        <div class="product-image">
          <img src="./Images/slide-03 - Copie.jpg" alt="Salle d'anniversaire">
        </div>
        <div class="product-details">
          <div class="product-category">Salle d'anniversaire</div>
          <div class="product-normal">Normal</div>
        </div>
      </div>

    </div>
  </section>
</body>
</html>
